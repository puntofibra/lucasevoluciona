<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04050d; --panel:rgba(14,20,40,.72); --line:rgba(120,200,255,.18);
  --neon:#22e4ff; --pink:#ff3bd4; --lucas:#17ff5f; --red:#ff3b5c; --gold:#ffd23f;
  --txt:#e9f4ff; --mut:#8aa0bf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Rajdhani,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(1200px 700px at 15% 10%,rgba(30,120,80,.28),transparent 60%),radial-gradient(900px 600px at 90% 90%,rgba(0,120,200,.25),transparent 60%),var(--bg)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:fixed;inset:0;z-index:2;overflow:auto}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
input{font-family:inherit}
img{-webkit-user-drag:none}
.hidden{display:none!important}

/* ── botones ── */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 18px;border-radius:16px;overflow:hidden;
  font-family:Orbitron;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:#fff;
  background:linear-gradient(135deg,rgba(34,228,255,.22),rgba(80,60,200,.22));border:1px solid rgba(34,228,255,.5);box-shadow:0 0 18px rgba(34,228,255,.2);transition:transform .1s, filter .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5}
.btn.green{background:linear-gradient(135deg,rgba(23,255,95,.38),rgba(0,160,90,.25));border-color:var(--lucas);box-shadow:0 0 22px rgba(23,255,95,.35)}
.btn.gold{background:linear-gradient(135deg,rgba(255,210,63,.4),rgba(255,120,30,.25));border-color:var(--gold);box-shadow:0 0 22px rgba(255,210,63,.35)}
.btn.ghost{background:rgba(255,255,255,.05);border-color:var(--line);box-shadow:none}
.btn.sm{padding:10px 14px;font-size:12px;width:auto}
.btn.big{padding:18px;font-size:19px;letter-spacing:2px}
.btn.huge{padding:22px;font-size:24px;letter-spacing:3px;border-radius:22px}
.btn.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 18px rgba(23,255,95,.35)}50%{box-shadow:0 0 40px rgba(23,255,95,.75),0 0 80px rgba(23,255,95,.25)}}
.btn.holdable::after{content:'';position:absolute;left:0;bottom:0;height:4px;width:var(--hold,0%);background:var(--lucas);box-shadow:0 0 10px var(--lucas)}
.row{display:flex;gap:10px;width:100%}
.row>.btn{flex:1}
.lnk{color:var(--neon);font-size:15px;text-decoration:underline;padding:6px;align-self:center}

/* ── pantallas ── */
.screen{min-height:100%;display:flex;align-items:center;justify-content:center;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.menu{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;padding:22px;align-items:stretch}
.logoBox{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.logoBox .fm{width:min(240px,62%);filter:drop-shadow(0 0 10px rgba(23,255,95,.55))}
.pres{font-family:Orbitron;font-weight:700;font-size:12px;letter-spacing:8px;color:#cfe8ff;opacity:.85;margin:-2px 0 2px;padding-left:8px}
.title{font-family:Orbitron;font-weight:900;font-size:clamp(28px,8vw,40px);line-height:1;letter-spacing:2px;text-align:center;
  background:linear-gradient(180deg,#fff 10%,#9dffbf 45%,#17ff5f 60%,#0fbf6a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(23,255,95,.6))}
.title small{display:block;font-size:.42em;letter-spacing:7px;color:var(--neon);-webkit-text-fill-color:var(--neon);filter:drop-shadow(0 0 8px var(--neon));margin-top:6px}
.hero{position:relative;height:150px;display:flex;justify-content:center;align-items:flex-end}
.heroBot{position:relative;width:150px;height:150px;animation:float 3s ease-in-out infinite}
.hero img{position:relative;z-index:1;height:150px;filter:drop-shadow(0 0 18px rgba(23,255,95,.45))}
/* llamas de los propulsores */
.fl{position:absolute;z-index:0;top:79%;width:10%;height:22%;transform-origin:50% 0;
  background:radial-gradient(ellipse at 50% 12%,#fff 0 14%,#d6ffe2 24%,#17ff5f 48%,rgba(23,255,95,0) 72%);
  border-radius:45% 45% 50% 50%/25% 25% 75% 75%;filter:blur(.6px) drop-shadow(0 0 6px #17ff5f);animation:fl .11s infinite alternate}
@keyframes fl{from{transform:translateX(-50%) scale(1.08,.82)}to{transform:translateX(-50%) scale(.88,1.18)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.chain{display:flex;justify-content:center;gap:4px;flex-wrap:nowrap;overflow:hidden}
.chain img{width:26px;height:26px}
.chain img.no{filter:brightness(0) opacity(.35)}
.stats{display:flex;gap:8px}
.stat{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center}
.stat b{display:block;font-family:Orbitron;font-size:18px;color:#fff}
.stat small{font-size:12px;color:var(--mut);letter-spacing:1px;text-transform:uppercase}
.stat.fire b{color:#ff9a3d;text-shadow:0 0 10px rgba(255,140,40,.7)}
.mis{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,rgba(255,210,63,.12),rgba(255,59,212,.08));border:1px solid rgba(255,210,63,.35);border-radius:16px;padding:10px 12px}
.mis .ic{font-size:26px}
.mis .tx{flex:1;font-size:15px;line-height:1.2}
.mis .tx small{display:block;color:var(--gold);font-family:Orbitron;font-size:10px;letter-spacing:2px}
.mis .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
.mis .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff8a3d);box-shadow:0 0 8px var(--gold)}
.mis.done{border-color:var(--lucas);background:linear-gradient(135deg,rgba(23,255,95,.15),rgba(34,228,255,.08))}
.mis.done .bar i{background:var(--lucas)}
.banner{background:rgba(34,228,255,.12);border:1px solid rgba(34,228,255,.4);border-radius:12px;padding:8px 12px;font-size:15px;text-align:center}
.who{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--mut)}
.who b{color:#fff}
.ptxt{color:var(--mut);font-size:16px;text-align:center;line-height:1.3}
.lbl{font-size:13px;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin:-4px 0 -6px 4px}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;font-size:17px;outline:none}
.inp:focus{border-color:var(--neon);box-shadow:0 0 12px rgba(34,228,255,.3)}
.segm{display:flex;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;border:1px solid var(--line)}
.segm button{flex:1;padding:10px;border-radius:10px;font-family:Orbitron;font-size:12px;letter-spacing:1px;color:var(--mut)}
.segm button.on{background:rgba(23,255,95,.2);color:#fff;box-shadow:0 0 12px rgba(23,255,95,.3)}
.sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--line)}
.gBtn{display:flex;justify-content:center;min-height:44px}
.iconRow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.ib{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center}
.ib:active{transform:scale(.92)}

/* ── juego ── */
#game{position:fixed;inset:0;z-index:3;display:grid;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));gap:8px;
  grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;grid-template-areas:"hud" "board" "ladder" "pw"}
#game.fever{animation:feverBg 1s infinite}
@keyframes feverBg{0%,100%{background:radial-gradient(circle at 50% 50%,rgba(255,210,63,.12),transparent 70%)}50%{background:radial-gradient(circle at 50% 50%,rgba(255,59,212,.16),transparent 70%)}}
.hud{grid-area:hud;display:flex;align-items:center;gap:8px}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center}
.hcard small{font-family:Orbitron;font-size:9px;letter-spacing:2px;color:var(--mut)}
.hScore{flex:1;min-width:0}
.hScore b{font-family:Orbitron;font-weight:900;font-size:26px;line-height:1.05;color:#fff;text-shadow:0 0 12px rgba(34,228,255,.6);transition:transform .1s}
.hScore b.bump{transform:scale(1.15)}
.hScore span{font-size:13px;color:var(--gold)}
.hNext{align-items:center;padding:4px 8px}
.hNext canvas{width:52px;height:52px}
.hCombo{position:absolute;left:50%;top:26%;transform:translateX(-50%);pointer-events:none;font-family:Orbitron;font-weight:900;text-align:center;z-index:5}
.hBtn{width:46px;height:46px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center}
.boardWrap{grid-area:board;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:none}
#cv{display:block;touch-action:none;border-radius:20px}
#marco{position:absolute;pointer-events:none;z-index:2;max-width:none;transition:filter .3s}
#marco.fever{filter:drop-shadow(0 0 14px #ffd23f) drop-shadow(0 0 4px #ffd23f)}
#marco.danger{animation:mDanger .45s infinite}
@keyframes mDanger{50%{filter:drop-shadow(0 0 16px #ff3b5c) drop-shadow(0 0 6px #ff3b5c)}}
.ladder{grid-area:ladder;display:flex;justify-content:center;gap:3px;padding:2px 0}
.ladder .st{position:relative;display:flex;flex-direction:column;align-items:center}
.ladder img{width:26px;height:26px;transition:transform .3s}
.ladder .st.no img{filter:brightness(0) opacity(.35)}
.ladder .st.cur img{transform:scale(1.25);filter:drop-shadow(0 0 6px #fff)}
.ladder .st span{display:none}
.pw{grid-area:pw;display:flex;gap:8px;justify-content:center}
.pwb{position:relative;flex:1;max-width:130px;height:52px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-family:Orbitron;font-size:11px;letter-spacing:1px}
.pwb .e{font-size:22px}
.pwb em{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--lucas);color:#03140a;font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 10px var(--lucas)}
.pwb.zero{opacity:.4}
.pwb.zero em{background:#555;box-shadow:none;color:#ccc}
.pwb.on{border-color:var(--red);box-shadow:0 0 20px rgba(255,59,92,.6);animation:blink .6s infinite}
@keyframes blink{50%{background:rgba(255,59,92,.25)}}
.pwb.gain{animation:gain .7s}
@keyframes gain{30%{transform:scale(1.25);box-shadow:0 0 30px var(--lucas)}}
.sideInfo{display:none}

@media (orientation:landscape) and (min-width:760px){
  #game{grid-template-columns:1fr 2fr 1fr;grid-template-rows:1fr auto;grid-template-areas:"hud board ladder" "pw board ladder";gap:18px;padding:16px 24px}
  .hud{flex-direction:column;align-items:stretch;justify-content:center;gap:12px;max-width:260px;justify-self:end;width:100%}
  .hScore{flex:none;padding:12px 16px}
  .hScore b{font-size:40px}
  .hNext{flex-direction:row;gap:12px;padding:10px 14px}
  .hNext canvas{width:72px;height:72px}
  .hBtns{display:flex;gap:8px}
  .pw{flex-direction:column;justify-self:end;max-width:260px;width:100%;align-self:start}
  .pwb{max-width:none;height:56px;font-size:12px}
  .ladder{flex-direction:column-reverse;justify-content:center;align-items:flex-start;gap:4px;justify-self:start}
  .ladder .st{flex-direction:row;gap:10px}
  .ladder img{width:34px;height:34px}
  .ladder .st span{display:block;font-family:Orbitron;font-size:12px;letter-spacing:1px;color:var(--mut)}
  .ladder .st.cur span{color:#fff}
  .ladder .st.no span{opacity:.4}
  .sideInfo{display:block;margin-top:12px;max-width:240px}
}
.hBtns{display:flex;gap:8px}

/* ── overlays ── */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,3,10,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.modal{width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;animation:popIn .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}}
h2.t{font-family:Orbitron;font-size:20px;letter-spacing:2px;margin:0;text-align:center;color:#fff;text-shadow:0 0 12px rgba(34,228,255,.6)}
.howto p{margin:6px 0;font-size:16px;line-height:1.35}
.goScore{font-family:Orbitron;font-weight:900;font-size:54px;text-align:center;color:#fff;text-shadow:0 0 20px rgba(34,228,255,.8);line-height:1}
.goRec{font-family:Orbitron;font-weight:900;text-align:center;font-size:20px;color:var(--gold);text-shadow:0 0 14px var(--gold);animation:recA .8s infinite alternate}
@keyframes recA{to{transform:scale(1.08)}}
.goLucas{height:110px;display:block;margin:0 auto -6px;filter:drop-shadow(0 0 14px rgba(23,255,95,.4))}
.rk{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto}
.rk .r{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04);font-size:17px}
.rk .r.me{background:rgba(23,255,95,.15);border:1px solid rgba(23,255,95,.5)}
.rk .r .p{width:30px;font-family:Orbitron;font-weight:900;text-align:center;color:var(--mut)}
.rk .r:nth-child(1) .p{color:#ffd23f}.rk .r:nth-child(2) .p{color:#d6e2ef}.rk .r:nth-child(3) .p{color:#e09a5a}
.rk .r .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .r .s{font-family:Orbitron;font-weight:700}
.rk .r img{width:24px;height:24px}
.col{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.col .c{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.col .c img{width:64px;height:64px}
.col .c.no img{filter:brightness(0) opacity(.3)}
.col .c b{display:block;font-family:Orbitron;font-size:12px;letter-spacing:1px;margin-top:4px}
.col .c small{color:var(--mut)}
#evo{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;text-align:center;font-family:Orbitron;font-weight:900}
#evo .in{animation:evoA 2.4s forwards}
#evo img{width:120px;height:120px;filter:drop-shadow(0 0 24px #fff)}
#evo .l1{font-size:14px;letter-spacing:4px;color:var(--gold);text-shadow:0 0 10px var(--gold)}
#evo .l2{font-size:30px;letter-spacing:2px;color:#fff;text-shadow:0 0 18px var(--lucas)}
@keyframes evoA{0%{transform:scale(.2) rotate(-20deg);opacity:0}15%{transform:scale(1.2) rotate(4deg);opacity:1}25%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.4) translateY(-40px)}}
/* avisos con el estilo del juego */
/* aviso de girar el dispositivo */
#rot{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(23,255,95,.15),transparent 60%),#04050d;padding:20px;text-align:center}
.rotBox{display:flex;flex-direction:column;align-items:center;gap:10px}
.rotBox img{width:110px;filter:drop-shadow(0 0 14px rgba(23,255,95,.5))}
.rotPh{width:46px;height:78px;border:4px solid var(--lucas);border-radius:10px;box-shadow:0 0 16px var(--lucas);animation:rotA 1.8s ease-in-out infinite}
#rot.toLand .rotPh{animation:rotB 1.8s ease-in-out infinite}
@keyframes rotA{0%,25%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@keyframes rotB{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160%) scale(.9);opacity:0;z-index:60;width:max-content;max-width:min(440px,92vw);
  display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:20px;color:#fff;font-size:16px;font-weight:600;line-height:1.25;
  background:linear-gradient(135deg,rgba(14,26,48,.97),rgba(6,12,26,.97)) padding-box,linear-gradient(135deg,#17ff5f,#22e4ff) border-box;border:2px solid transparent;
  box-shadow:0 0 24px rgba(23,255,95,.35),0 12px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .25s;pointer-events:none}
#toast.on{transform:translate(-50%,0) scale(1);opacity:1}
#toast img{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 8px rgba(23,255,95,.6))}
#toast b{display:block;font-family:Orbitron;font-size:11px;letter-spacing:3px;color:var(--lucas);margin-bottom:2px}
#toast.err{background:linear-gradient(135deg,rgba(40,10,20,.97),rgba(16,6,12,.97)) padding-box,linear-gradient(135deg,#ff3b5c,#ff9a3d) border-box;box-shadow:0 0 24px rgba(255,59,92,.4),0 12px 30px rgba(0,0,0,.5)}
#toast.err b{color:#ff6b84}
#toast.err img{filter:drop-shadow(0 0 8px rgba(255,59,92,.6))}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid rgba(23,255,95,.2);border-top-color:var(--lucas);animation:spin 1s linear infinite;margin:12px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.nfcAnim{width:90px;height:90px;margin:0 auto;color:var(--lucas);position:relative}
.nfcAnim svg{width:100%;height:100%;filter:drop-shadow(0 0 10px var(--lucas))}
.adm table{width:100%;border-collapse:collapse;font-size:14px}
.adm td,.adm th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.adm th{color:var(--mut);font-weight:600}
.chk{display:flex;align-items:center;gap:10px;font-size:16px}
.chk input{width:22px;height:22px;accent-color:var(--lucas)}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app"></div>

<div id="game" class="hidden">
  <div class="hud">
    <div class="hcard hScore"><small>PUNTOS</small><b id="hSc">0</b><span id="hBest">🏆 0</span></div>
    <div class="hcard hNext"><small>SIGUIENTE</small><canvas id="hNx" width="144" height="144"></canvas></div>
    <div class="hBtns"><button class="hBtn" id="bPause" title="Pausa">⏸</button></div>
    <div class="sideInfo" id="sideInfo"></div>

function stepDown(im, W){

/* música de fondo sintetizada */
const MUS = (()=>{

      if (s%4===2){ const b=c.createBuffer(1,c.sampleRate*.04,c.sampleRate), a=b.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=(Math.random()*2-1)*(1-i/a.length);
        const src=c.createBufferSource(), g=c.createGain(), f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000; src.buffer=b; g.gain.value=.05; src.connect(f); f.connect(g); g.connect(gain); src.start(nextT); }

})();

}

function holdBtn(el, ms, onHold, onClick, bar){
  let t=null, start=0, raf=0, fired=false;
  const prog = ()=>{ if(!bar) return; const p=Math.min(1,(Date.now()-start)/ms); el.style.setProperty('--hold', (p*100)+'%'); if(p<1) raf=requestAnimationFrame(prog); };
  const down = ()=>{ fired=false; start=Date.now(); t=setTimeout(()=>{ fired=true; vib(60); el.style.setProperty('--hold','0%'); onHold(); }, ms); if(bar) prog(); };
  const up = ()=>{ clearTimeout(t); cancelAnimationFrame(raf); el.style.setProperty('--hold','0%'); };
  el.addEventListener('pointerdown', down); el.addEventListener('pointerup', up); el.addEventListener('pointerleave', up); el.addEventListener('pointercancel', up);
  el.addEventListener('contextmenu', e=>e.preventDefault());
  el.addEventListener('click', e=>{ if(fired){ e.preventDefault(); e.stopPropagation(); fired=false; return; } onClick && onClick(e); });
}

/* ════════════════════════════════════════════════════════════
   MOTOR DEL JUEGO
   ════════════════════════════════════════════════════════════ */
const BW = 400, BH = 680, LINE_Y = 165, GRAV = 1500;
/* Lucas arriba sujetando la bola: su tamaño, la altura de sus manos y dónde cuelga la bola */
const LUC_H = 104, LUC_TOP = 2, HAND_Y = LUC_TOP + LUC_H*.80;
const holdY = r => HAND_Y + r*.55;
const FONDO = new Image(); FONDO.src = 'img/fondo.webp';
/* hueco interior del marco (en píxeles de img/marco.webp, 848x1264) */
const MARCO = {w:848, h:1264, x:150.5, y:170, hw:547, hh:932.5};
const cv = $('#cv'), cx = cv.getContext('2d'), nx = $('#hNx').getContext('2d');
let G = null, SC = 1, DPR = 1, rafId = 0, lastT = 0;

function rndPiece(){
  const w=[32,27,20,13,8], tot=w.reduce((a,b)=>a+b,0); let r=Math.random()*tot;
  for(let i=0;i<w.length;i++){ if((r-=w[i])<0) return i; } return 0;
}
function newGame(saved){
  const pwBase = misHoy().st.done ? 2 : 1;
  G = {
    bodies:[], parts:[], texts:[], rings:[], score:0, combo:0, lastMerge:-9, comboMax:0, merges:0, maxLv:0,
    made:Array(11).fill(0), cur:rndPiece(), next:rndPiece(), aimX:BW/2, aiming:false, dropCd:0, dangerT:0, dangerBeep:0,
    over:false, paused:false, shake:0, flash:0, t:0, fever:0, mode:null, pw:{laser:pwBase,sacudir:pwBase,cambio:pwBase},
    nextPw:2500, id: Date.now().toString(36)+Math.random().toString(36).slice(2,8), uid:1, lucasX:BW/2, saveT:0, sent:false, holdT:0, lastSec:9, pose:'sujeta', poseT:0
  };
  if (saved){
    Object.assign(G, {score:saved.score, comboMax:saved.comboMax, merges:saved.merges, maxLv:saved.maxLv, made:saved.made, cur:saved.cur, next:saved.next, pw:saved.pw, nextPw:saved.nextPw, id:saved.id, t:saved.t});
    saved.b.forEach(a=>G.bodies.push(mkBody(a[0],a[1],a[2],a[3]*0,a[4]*0, true)));
  }
}
function mkBody(lv, x, y, vx=0, vy=0, aged=false){
  return {id:G.uid++, lv, x, y, vx, vy, r: aged?LV[lv].r:LV[lv].r*.55, ang:Math.random()*6.28, age: aged?5:0, dead:false};
}
function saveGame(){
  if (!G || G.over || !G.bodies.length) return;
  LS.set('save', {score:G.score, comboMax:G.comboMax, merges:G.merges, maxLv:G.maxLv, made:G.made, cur:G.cur, next:G.next, pw:G.pw, nextPw:G.nextPw, id:G.id, t:G.t,
    b:G.bodies.filter(b=>!b.dead).map(b=>[b.lv, Math.round(b.x*10)/10, Math.round(b.y*10)/10, 0, 0])});
}

function startGame(saved){
  closeModal();
  app.innerHTML = '';
  $('#game').classList.remove('hidden');
  newGame(saved);
  shownScore = G.score; $('#hSc').textContent = fmt(G.score);
  buildLadder(); updHud(); updPw(); resize(); drawNext();
  $('#sideInfo').innerHTML = misHTML();
  ac(); musSync();
  cancelAnimationFrame(rafId); lastT = performance.now(); rafId = requestAnimationFrame(loop);
  if (!saved && !LS.get('howSeen', false)){ LS.set('howSeen', true); howTo(); }
}
function hideGame(){ $('#game').classList.add('hidden'); cancelAnimationFrame(rafId); $('#evo').innerHTML=''; }

function resize(){
  const bw = $('#bw'); if (!bw || $('#game').classList.contains('hidden')) return;
  const aw = bw.clientWidth, ah = bw.clientHeight;
  /* el marco sobresale del tablero: ~33% más ancho y ~30% más alto */
  let w = Math.min(aw/1.34, (ah/1.31)*BW/BH); w = Math.max(160, w);
  const h = w*BH/BW;
  DPR = Math.min(3, window.devicePixelRatio||1);
  SC = w/BW;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  cv.width = Math.round(w*DPR); cv.height = Math.round(h*DPR);
  const s = w/MARCO.hw, m = $('#marco');
  if (m){ m.style.width = MARCO.w*s+'px'; m.style.height = MARCO.h*s+'px';
    m.style.left = (cv.offsetLeft - MARCO.x*s)+'px'; m.style.top = (cv.offsetTop - MARCO.y*s)+'px'; }
  spriteCache.clear();
}
addEventListener('resize', ()=>{ resize(); });

/* ── HUD ── */
let shownScore = 0;
function updHud(){
  $('#hBest').textContent = '🏆 ' + fmt(Math.max(bestLocal(), G?G.score:0));
}
function drawNext(){
  if (!G) return; nx.clearRect(0,0,144,144);
  const R = 46; nx.imageSmoothingQuality = 'high'; const sp = sprite(G.next, R); nx.drawImage(sp, Math.round(72-sp.width/2), Math.round(72-sp.width/2));
}
function updPw(){
  document.querySelectorAll('.pwb').forEach(b=>{
    const k=b.dataset.p, n=G.pw[k]; b.querySelector('em').textContent=n; b.classList.toggle('zero', n<1); b.classList.toggle('on', G.mode===k);
  });
}
function buildLadder(){
  const m = Math.max(evoMax(), G?G.maxLv:0);
  $('#ladder').innerHTML = LV.map((l,i)=>`<div class="st ${i>m?'no':''} ${G&&i===G.maxLv?'cur':''}"><img data-lv="${i}" src="${iconURL(i)}"><span>${i>m?'???':esc(l.n)}</span></div>`).join('');
}

/* ── controles ── */
function toLocal(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/SC, y:(e.clientY-r.top)/SC}; }
const bwEl = $('#bw');
bwEl.addEventListener('pointerdown', e=>{
  if (!G || G.over || G.paused) return; ac();
  const p = toLocal(e);
  if (G.mode==='laser'){ zapAt(p); return; }
  G.aiming = true; G.aimX = p.x; try{ bwEl.setPointerCapture(e.pointerId); }catch(_){}
});
bwEl.addEventListener('pointermove', e=>{ if(!G || G.over) return; if (G.aiming || e.pointerType==='mouse') G.aimX = toLocal(e).x; });
bwEl.addEventListener('pointerup', e=>{
  if(!G || !G.aiming) return; G.aiming=false;
  const r = cv.getBoundingClientRect(), m = 24;
  if (e.clientX < r.left-m || e.clientX > r.right+m || e.clientY < r.top-m*3 || e.clientY > r.bottom+m) return;  // soltado fuera: no se lanza
  G.aimX = toLocal(e).x; drop();
});
bwEl.addEventListener('pointercancel', ()=>{ if(G) G.aiming=false; });
const KEYS = {};
addEventListener('keydown', e=>{
  if (!G || $('#game').classList.contains('hidden')) return;
  KEYS[e.key]=1;
  if (e.key===' '||e.key==='ArrowDown'||e.key==='Enter'){ e.preventDefault(); if(!G.paused) drop(); }
  if (e.key==='p'||e.key==='P'||e.key==='Escape') G.paused ? resume() : pause();
  if (e.key==='1') usePw('laser'); if (e.key==='2') usePw('sacudir'); if (e.key==='3') usePw('cambio');
});
addEventListener('keyup', e=>{ KEYS[e.key]=0; });
document.querySelectorAll('.pwb').forEach(b=>b.onclick=()=>usePw(b.dataset.p));
$('#bPause').onclick = ()=>{ SFX.click(); pause(); };

function drop(){
  if (!G || G.over || G.paused || G.dropCd>0 || G.mode) return;
  const r = LV[G.cur].r; G.lucasX = G.aimX = Math.max(r+2, Math.min(BW-r-2, G.aimX));
  const b = mkBody(G.cur, G.lucasX, holdY(r), 0, 260); b.r = r; G.bodies.push(b);
  G.cur = G.next; G.next = rndPiece(); G.dropCd = .42; G.holdT = 0; G.lastSec = 9;
  setPose('suelta', .4);
  SFX.drop(); vib(8); drawNext();
}

/* ── poderes ── */
function usePw(k){
  if (!G || G.over || G.paused) return;
  if (G.mode===k){ G.mode=null; updPw(); return; }
  if (G.pw[k] < 1){ toast('Ganas poderes cada 2.500 puntos y con la misión del día'); return; }
  SFX.click();
  if (k==='laser'){ G.mode='laser'; updPw(); toast('🎯 Toca la pieza que quieres eliminar'); return; }
  G.pw[k]--;
  if (k==='sacudir'){
    G.bodies.forEach(b=>{ b.vy -= 380 + Math.random()*420; b.vx += (Math.random()-.5)*520; });
    G.shake = 16; SFX.shake(); vib([30,40,30]);
  }
  if (k==='cambio'){ const t=G.cur; G.cur=G.next; G.next=t; SFX.swap(); drawNext(); }
  updPw();
}
function zapAt(p){
  let hit=null;
  for (const b of G.bodies){ if(!b.dead && Math.hypot(b.x-p.x,b.y-p.y) < b.r+6){ hit=b; break; } }
  if (!hit){ toast('Toca una pieza'); return; }
  hit.dead = true; G.pw.laser--; G.mode=null; updPw();
  G.bodies = G.bodies.filter(b=>!b.dead);
  burst(hit.x, hit.y, '#ff3b5c', 40, 1.4); burst(hit.x, hit.y, LV[hit.lv].c, 30, 1);
  G.rings.push({x:hit.x,y:hit.y,r:hit.r,max:hit.r*3,life:.5,t:0,c:'#ff3b5c'});
  G.beam = {x:hit.x, y:hit.y, t:.35};
  G.shake = 8; SFX.laser(); vib(40);
}
function gainPw(){
  const ks=['laser','sacudir','cambio'], k=ks[Math.floor(Math.random()*3)];
  if (G.pw[k]>=5) return;
  G.pw[k]++; updPw(); SFX.gain();
  const el=document.querySelector(`.pwb[data-p="${k}"]`); el.classList.remove('gain'); void el.offsetWidth; el.classList.add('gain');
  floatText(BW/2, BH*.45, '+1 '+({laser:'🎯 LÁSER',sacudir:'🌀 SACUDIR',cambio:'🔄 CAMBIAR'})[k], '#17ff5f', 26);
}

/* ── pausa ── */
function pause(auto){
  if (!G || G.over) return; G.paused = true; saveGame();
  modal(`<h2 class="t">⏸ PAUSA</h2>
    <div class="goScore" style="font-size:40px">${fmt(G.score)}</div>
    <button class="btn huge green" id="pRes">▶ SEGUIR</button>
    <div class="row"><button class="btn ghost" id="pSnd">${AU.on?'🔊 Sonido':'🔇 Sin sonido'}</button><button class="btn ghost" id="pMus">${LS.get('mus',true)?'🎵 Música':'🎵 Sin música'}</button></div>
    <button class="btn ghost" id="pHow">❓ Cómo se juega</button>
    <div class="row"><button class="btn ghost" id="pRe">🔁 Reiniciar</button><button class="btn ghost" id="pMenu">🏠 Menú</button></div>`, resume);
  $('#pRes').onclick = resume;
  $('#pSnd').onclick = ()=>{ setSound(!AU.on); pause(); };
  $('#pMus').onclick = ()=>{ setMusic(!LS.get('mus',true)); pause(); };
  $('#pHow').onclick = ()=>{ howTo(); const b=$('#modal .btn.green'); if(b) b.onclick=resume; };
  $('#pRe').onclick = ()=>{ LS.del('save'); startGame(); };
  $('#pMenu').onclick = ()=>{ saveGame(); closeModal(); G=null; showMenu(); };
}
function resume(){ closeModal(); if(!G) return; G.paused=false; lastT=performance.now(); ac(); musSync(); }

/* ── efectos ── */
function burst(x, y, c, n=18, sp=1){
  for(let i=0;i<n;i++){ const a=Math.random()*6.283, v=(80+Math.random()*320)*sp;
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:.5+Math.random()*.6,t:0,c,s:2+Math.random()*4}); }
  if (G.parts.length>700) G.parts.splice(0, G.parts.length-700);
}
function floatText(x, y, txt, c='#fff', size=22){ G.texts.push({x,y,txt,c,size,t:0,life:1.1}); }
function burstConfetti(){ if(!G) return; const cs=['#17ff5f','#22e4ff','#ff3bd4','#ffd23f','#ff8a3d'];
  for(let i=0;i<120;i++) G.parts.push({x:Math.random()*BW,y:-10,vx:(Math.random()-.5)*200,vy:Math.random()*200,life:1.8+Math.random(),t:0,c:cs[i%5],s:3+Math.random()*4,conf:1}); }
function showEvo(lv){
  const el=$('#evo');
  el.innerHTML = `<div class="in"><img src="${iconURL(lv,96)}"><div class="l1">¡NUEVA EVOLUCIÓN!</div><div class="l2">${esc(LV[lv].n)}</div></div>`;
  clearTimeout(el._t); el._t=setTimeout(()=>el.innerHTML='', 2500);
}
function comboText(n, fever){
  const el=$('#hCombo');
  el.innerHTML = `<div style="font-size:${Math.min(60,26+n*5)}px;color:${fever?'#ffd23f':'#ff3bd4'};text-shadow:0 0 20px ${fever?'#ffd23f':'#ff3bd4'};animation:popIn .3s">COMBO x${n}</div>${fever?'<div style="font-size:20px;color:#fff;text-shadow:0 0 14px #ffd23f">⚡ FIEBRE 5G ⚡</div>':''}`;
  clearTimeout(el._t); el._t=setTimeout(()=>el.innerHTML='', 1100);
}

/* ── fusión ── */
function merge(a, b){
  a.dead = b.dead = true;
  const x = (a.x*a.r*a.r + b.x*b.r*b.r)/(a.r*a.r+b.r*b.r), y = (a.y+b.y)/2;
  const lv = a.lv;
  G.merges++;
  if (G.t - G.lastMerge < 0.9) G.combo++; else G.combo = 1;
  G.lastMerge = G.t; G.comboMax = Math.max(G.comboMax, G.combo);
  if (G.combo===5 && G.fever<=0){ G.fever = 7; SFX.fever(); $('#game').classList.add('fever'); }
  const mult = Math.min(5, 1 + (G.combo-1)*.5) * (G.fever>0?2:1);
  let pts;
  if (lv === MAXL){   /* SUPERNOVA: dos Lucas */
    pts = Math.round(5000*mult);
    burst(x,y,'#17ff5f',160,2.2); burst(x,y,'#ffffff',80,1.6); burst(x,y,'#22e4ff',80,2);
    G.rings.push({x,y,r:10,max:520,life:1.2,t:0,c:'#17ff5f'}); G.shake=30; G.flash=1;
    floatText(x, y-40, '¡SUPERNOVA LUCAS!', '#17ff5f', 34); setPose('celebra', 2.5); SFX.lucas(); vib([80,60,80,60,200]);
  } else {
    const nl = lv+1, nb = mkBody(nl, x, y, (a.vx+b.vx)/2, Math.min(a.vy,b.vy)/2 - 60);
    nb.r = Math.max(a.r, b.r); G.bodies.push(nb);
    G.made[nl]++; pts = Math.round(PTS[nl]*mult);
    if (nl > G.maxLv){ G.maxLv = nl; buildLadderSoon(); }
    if (nl >= 7 || G.combo >= 4) setPose('celebra', 1.4);
    if (nl > evoMax()){ setPose('celebra', 1.8); LS.set('evo', nl); showEvo(nl); SFX.evolve(); G.flash = .6; buildLadderSoon(); burstConfetti(); }
    const c = LV[nl].c;
    burst(x, y, c, 14+nl*5, .8+nl*.12); burst(x, y, '#ffffff', 6+nl*2, .6);
    G.rings.push({x,y,r:nb.r*.6,max:LV[nl].r*1.9,life:.45,t:0,c});
    G.shake = Math.max(G.shake, nl>=5 ? 3+nl*1.4 : 0);
    if (nl===MAXL){ floatText(x, y-60, '¡LUCAS GIGANTE!', '#17ff5f', 32); SFX.lucas(); G.flash=1; vib([60,40,120]); }
    SFX.merge(nl, G.combo); vib(nl>=6?[20,20,40]:12);
  }
  G.score += pts;
  floatText(x, y, '+'+fmt(pts), G.fever>0?'#ffd23f':'#fff', 18+Math.min(16, lv*2));
  if (G.combo>=2){ comboText(G.combo, G.fever>0); SFX.combo(G.combo); }
  const sc=$('#hSc'); sc.classList.add('bump'); setTimeout(()=>sc.classList.remove('bump'),100);
  while (G.score >= G.nextPw){ G.nextPw += 2500; gainPw(); }
  misCheck(false);
}
let ladT=0; function buildLadderSoon(){ clearTimeout(ladT); ladT=setTimeout(buildLadder, 50); }

/* ── físicas ── */
function physics(dt){
  const SUB = 8, h = dt/SUB; let B = G.bodies;
  for (let s=0; s<SUB; s++){
    for (const b of B){
      if (b.dead) continue;
      const tr = LV[b.lv].r; if (b.r < tr) b.r = Math.min(tr, b.r + tr*4*h);
      b.vy += GRAV*h; b.x += b.vx*h; b.y += b.vy*h;
      if (b.x - b.r < 0){ b.x = b.r; b.vx = Math.abs(b.vx)*.2; }
      if (b.x + b.r > BW){ b.x = BW-b.r; b.vx = -Math.abs(b.vx)*.2; }
      if (b.y + b.r > BH){ b.y = BH-b.r; if (b.vy>0) b.vy = -b.vy*.15; b.vx *= .985; }
    }
    for (let i=0; i<B.length; i++){
      const a = B[i]; if (a.dead) continue;
      for (let j=i+1; j<B.length; j++){
        const b = B[j]; if (b.dead) continue;
        const dx=b.x-a.x, dy=b.y-a.y, rs=a.r+b.r, d2=dx*dx+dy*dy;
        if (d2 >= rs*rs) continue;
        if (a.lv===b.lv && !G.over){ merge(a,b); break; }
        const d = Math.sqrt(d2)||.01, nxv=dx/d, nyv=dy/d, ov=rs-d;
        const ma=a.r*a.r, mb=b.r*b.r, im=1/(ma+mb);
        a.x -= nxv*ov*mb*im; a.y -= nyv*ov*mb*im; b.x += nxv*ov*ma*im; b.y += nyv*ov*ma*im;
        const rvx=b.vx-a.vx, rvy=b.vy-a.vy, vn=rvx*nxv+rvy*nyv;
        if (vn < 0){
          const jn = -(1.12)*vn/(1/ma+1/mb);
          a.vx -= jn*nxv/ma; a.vy -= jn*nyv/ma; b.vx += jn*nxv/mb; b.vy += jn*nyv/mb;
          const tx=-nyv, ty=nxv, vt=rvx*tx+rvy*ty, jt = -vt*.08/(1/ma+1/mb);
          a.vx -= jt*tx/ma; a.vy -= jt*ty/ma; b.vx += jt*tx/mb; b.vy += jt*ty/mb;
          a.av = (a.av||0) - vt*.002; b.av = (b.av||0) + vt*.002;
        }
      }
    }
    if (B.some(b=>b.dead)) B = G.bodies = B.filter(b=>!b.dead);
    for (const b of B){
      if (b.x - b.r < 0){ b.x = b.r; if (b.vx<0) b.vx = 0; }
      if (b.x + b.r > BW){ b.x = BW-b.r; if (b.vx>0) b.vx = 0; }
      if (b.y + b.r > BH){ b.y = BH-b.r; if (b.vy>0) b.vy = 0; }
    }
  }
  for (const b of G.bodies){
    b.vx *= .996; b.vy *= .998; b.age += dt;
    b.ang += (b.vx/b.r)*dt*.9 + (b.av||0)*dt; b.av = (b.av||0)*.95;
  }
}

/* ── bucle ── */
function loop(now){
  rafId = requestAnimationFrame(loop);
  let dt = Math.min(.033, (now-lastT)/1000); lastT = now;
  if (!G) return;
  if (!G.paused){
    if (!G.over){
      G.t += dt; G.dropCd = Math.max(0, G.dropCd-dt);
      if (KEYS.ArrowLeft) G.aimX -= 330*dt; if (KEYS.ArrowRight) G.aimX += 330*dt;
      const r = LV[G.cur].r; G.aimX = Math.max(r+2, Math.min(BW-r-2, G.aimX));
      physics(dt);
      /* tiempo por tirada: 8 s al empezar, baja con los puntos hasta 4 s */
      if (G.dropCd<=0 && !G.mode){
        G.holdT += dt; const left = holdLimit() - G.holdT, sec = Math.ceil(left);
        if (left <= 3 && sec !== G.lastSec && sec > 0){ G.lastSec = sec; tone(sec===1?990:660, .09, 'square', .07); }
        if (left <= 0){ G.aiming = false; drop(); }
      }
      if (G.poseT > 0) G.poseT -= dt;
      if (G.fever>0){ G.fever -= dt; if (G.fever<=0) $('#game').classList.remove('fever'); }
      checkDanger(dt);
      G.saveT += dt; if (G.saveT > 3){ G.saveT=0; saveGame(); }
    } else endAnim(dt);
    fxStep(dt);
  }
  render();
  if (shownScore !== G.score){ shownScore += Math.max(1, Math.ceil((G.score-shownScore)*.25)); if (shownScore>G.score) shownScore=G.score; $('#hSc').textContent = fmt(shownScore); updHud(); }
}
function holdLimit(){ return Math.max(4, 8 - G.score/5000); }
function setPose(p, t){ if (!G) return; G.pose = p; G.poseT = t; }
function curPose(){ if (G.dangerT > 0) return 'miedo'; return G.poseT > 0 ? G.pose : 'sujeta'; }
function checkDanger(dt){
  let top = 1e9;
  for (const b of G.bodies) if (b.age > 1.3 && Math.abs(b.vy) < 400) top = Math.min(top, b.y - b.r);
  G.warn = top < LINE_Y + 70;
  if (top < LINE_Y){
    G.dangerT += dt; G.dangerBeep -= dt;
    if (G.dangerBeep <= 0){ SFX.danger(); vib(15); G.dangerBeep = Math.max(.18, .6 - G.dangerT*.15); }
    if (G.dangerT > 3) gameOver();
  } else G.dangerT = Math.max(0, G.dangerT - dt*2);
}
function fxStep(dt){
  for (const p of G.parts){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.conf?180:600)*dt; p.vx *= p.conf?.99:.97; }
  G.parts = G.parts.filter(p=>p.t<p.life);
  for (const t of G.texts){ t.t += dt; t.y -= 50*dt; }
  G.texts = G.texts.filter(t=>t.t<t.life);
  for (const r of G.rings) r.t += dt;
  G.rings = G.rings.filter(r=>r.t<r.life);
  G.shake *= Math.pow(.02, dt); if (G.shake<.3) G.shake=0;
  G.flash = Math.max(0, G.flash - dt*2.2);
  if (G.beam){ G.beam.t -= dt; if (G.beam.t<=0) G.beam=null; }
  G.lucasX += (G.aimX - G.lucasX)*Math.min(1, dt*22);
}

/* ── dibujo ── */
function render(){
  const c = cx; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cv.width,cv.height); c.imageSmoothingQuality = 'high';
  const k = SC*DPR;
  let sx=0, sy=0; if (G.shake){ sx=(Math.random()-.5)*G.shake; sy=(Math.random()-.5)*G.shake; }
  c.setTransform(k,0,0,k,sx*k,sy*k);
  /* fondo del tablero */
  c.save(); roundRect(c,0,0,BW,BH,30); c.clip();
  c.fillStyle = '#050a16'; c.fillRect(0,0,BW,BH);
  if (FONDO.complete && FONDO.naturalWidth){ const s=Math.max(BW/FONDO.naturalWidth, BH/FONDO.naturalHeight), fw=FONDO.naturalWidth*s, fh=FONDO.naturalHeight*s; c.drawImage(FONDO,(BW-fw)/2,(BH-fh)/2,fw,fh); }
  if (G.fever>0){ c.fillStyle=`rgba(255,180,40,${.10+.06*Math.sin(performance.now()/120)})`; c.fillRect(0,0,BW,BH); }
  /* línea de peligro */
  const dz = G.dangerT>0, pulse = .5+.5*Math.sin(performance.now()/(dz?70:300));
  c.setLineDash([10,8]); c.lineWidth = dz?3:2;
  c.strokeStyle = dz ? `rgba(255,59,92,${.6+.4*pulse})` : G.warn ? `rgba(255,59,92,${.3+.4*pulse})` : 'rgba(255,59,92,.25)';
  c.beginPath(); c.moveTo(0,LINE_Y); c.lineTo(BW,LINE_Y); c.stroke(); c.setLineDash([]);
  if (dz){ c.fillStyle=`rgba(255,59,92,${.12*pulse+G.dangerT*.05})`; c.fillRect(0,0,BW,LINE_Y);
    c.fillStyle='#fff'; c.font='900 46px Orbitron'; c.textAlign='center'; c.textBaseline='middle';
    c.shadowColor='#ff3b5c'; c.shadowBlur=20; c.fillText(Math.ceil(3-G.dangerT), BW/2, LINE_Y+60); c.shadowBlur=0; }
  /* guía y pieza actual */
  if (!G.over){
    const r = LV[G.cur].r, ax = G.lucasX, now = performance.now(), bob = Math.sin(now/300)*2.5, py = holdY(r) + bob;
    let gy = BH;
    for (const b of G.bodies){ const dx=Math.abs(b.x-ax); if (dx < b.r+r && b.y>py){ const yy = b.y - Math.sqrt(Math.max(0,(b.r+r)**2-dx*dx)); if (yy<gy) gy=yy; } }
    c.strokeStyle = LV[G.cur].c; c.globalAlpha=.45; c.lineWidth=2; c.setLineDash([3,9]);
    c.beginPath(); c.moveTo(ax, py+r); c.lineTo(ax, gy+r); c.stroke(); c.setLineDash([]); c.globalAlpha=1;
    c.strokeStyle=LV[G.cur].c; c.globalAlpha=.3; c.beginPath(); c.arc(ax, gy, r, 0, 6.283); c.stroke(); c.globalAlpha=1;
    const pose = curPose(), LI = LUCAS[pose], ly = LUC_TOP + bob + (pose==='miedo' ? Math.sin(now/25)*1.2 : 0);
    /* fuego de los propulsores (por código) */
    c.save(); c.globalCompositeOperation='lighter';
    for (let j=-1;j<=1;j++){ const fx = ax + j*LUC_H*.085, fy = ly + LUC_H*.86, fl = LUC_H*(.13 + .05*Math.random());
      const g = c.createLinearGradient(0, fy, 0, fy+fl); g.addColorStop(0,'rgba(220,255,230,.95)'); g.addColorStop(.35,'rgba(23,255,95,.8)'); g.addColorStop(1,'rgba(23,255,95,0)');
      c.fillStyle = g; c.beginPath(); c.moveTo(fx-LUC_H*.035, fy); c.quadraticCurveTo(fx, fy+fl*1.2, fx+LUC_H*.035, fy); c.fill(); }
    c.restore();
    /* la bola que sujeta */
    const ready = G.dropCd<=0;
    if (ready){ const sp = sprite(G.cur, r*k); const S = sp.width/k; c.drawImage(sp, ax-S/2, py-S/2, S, S); }
    /* Lucas encima, con las manos sobre la bola */
    if (LI && LI.complete && LI.naturalWidth) c.drawImage(LI, ax-LUC_H/2, ly, LUC_H, LUC_H);
    /* cuenta atrás de la tirada (últimos 3 s) */
    const left = holdLimit() - G.holdT;
    if (ready && left <= 3 && !G.mode){
      const f = Math.max(0, left/3), col = left<=1 ? '#ff3b5c' : '#ffd23f';
      c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.arc(ax, py, r+7, 0, 6.283); c.stroke();
      c.strokeStyle = col; c.shadowColor = col; c.shadowBlur = 12;
      c.beginPath(); c.arc(ax, py, r+7, -Math.PI/2, -Math.PI/2 + 6.283*f); c.stroke(); c.shadowBlur = 0;
      c.font = `900 ${Math.max(16, r*.9)}px Orbitron`; c.textAlign='center'; c.textBaseline='middle';
      c.lineWidth = 4; c.strokeStyle='rgba(0,0,0,.7)'; c.strokeText(Math.ceil(left), ax, py); c.fillStyle = '#fff'; c.fillText(Math.ceil(left), ax, py);
    }
  }
  /* piezas */
  for (const b of G.bodies){
    if (b.lv === MAXL) drawAura(c, b.x, b.y, b.r);
    const sp = sprite(b.lv, LV[b.lv].r*k), S = sp.width/k * (b.r/LV[b.lv].r);
    c.save(); c.translate(b.x,b.y); c.rotate(b.ang);
    if (G.over && b.flash) c.globalAlpha = .5+.5*Math.sin(performance.now()/60);
    c.drawImage(sp, -S/2, -S/2, S, S); c.restore();
  }
  /* láser */
  if (G.mode==='laser'){ c.fillStyle='rgba(255,59,92,.08)'; c.fillRect(0,0,BW,BH); }
  if (G.beam){ c.strokeStyle=`rgba(255,59,92,${G.beam.t*2.5})`; c.lineWidth=6; c.shadowColor='#ff3b5c'; c.shadowBlur=20;
    c.beginPath(); c.moveTo(G.lucasX, LUC_TOP + LUC_H*.45); c.lineTo(G.beam.x, G.beam.y); c.stroke(); c.shadowBlur=0; }
  /* efectos */
  c.globalCompositeOperation='lighter';
  for (const r of G.rings){ const p=r.t/r.life; c.strokeStyle=r.c; c.globalAlpha=1-p; c.lineWidth=6*(1-p)+1; c.beginPath(); c.arc(r.x,r.y,r.r+(r.max-r.r)*easeOut(p),0,6.283); c.stroke(); }
  for (const p of G.parts){ const a=1-p.t/p.life; c.globalAlpha=a; c.fillStyle=p.c; c.beginPath(); c.arc(p.x,p.y,p.s*(p.conf?1:a+.3),0,6.283); c.fill(); }
  c.globalAlpha=1; c.globalCompositeOperation='source-over';
  for (const t of G.texts){ const a=1-t.t/t.life, s=t.t<.15?.6+t.t/.15*.5:1.1-Math.min(.1,(t.t-.15));
    c.globalAlpha=Math.min(1,a*1.5); c.font=`900 ${t.size*s}px Orbitron`; c.textAlign='center'; c.textBaseline='middle';
    c.lineWidth=4; c.strokeStyle='rgba(0,0,0,.6)'; c.strokeText(t.txt,t.x,t.y); c.fillStyle=t.c; c.shadowColor=t.c; c.shadowBlur=12; c.fillText(t.txt,t.x,t.y); c.shadowBlur=0; }
  c.globalAlpha=1;
  if (G.flash>0){ c.fillStyle=`rgba(255,255,255,${G.flash*.5})`; c.fillRect(0,0,BW,BH); }
  c.restore();
  const mc = $('#marco'); if (mc){ mc.classList.toggle('fever', G.fever>0); mc.classList.toggle('danger', G.dangerT>0); }
}
const easeOut = p=>1-Math.pow(1-p,3);
/* aura dorada con destellos alrededor de la bola de Lucas */
function drawAura(c, x, y, r){
  const t = performance.now()/1000, pul = .5+.5*Math.sin(t*3);
  c.save(); c.globalCompositeOperation = 'lighter';
  const g = c.createRadialGradient(x, y, r*.85, x, y, r*1.45);
  g.addColorStop(0, `rgba(255,215,60,${.55+.25*pul})`); g.addColorStop(.45, `rgba(255,190,40,${.25+.15*pul})`); g.addColorStop(1, 'rgba(255,170,0,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r*1.45, 0, 6.283); c.fill();
  /* rayos girando */
  c.translate(x, y); c.rotate(t*.6);
  for (let i=0;i<12;i++){ c.rotate(6.283/12); const l = r*(1.25 + .12*Math.sin(t*4+i*1.7));
    const gg = c.createLinearGradient(0, r*.95, 0, l); gg.addColorStop(0,'rgba(255,230,120,.6)'); gg.addColorStop(1,'rgba(255,200,40,0)');
    c.fillStyle = gg; c.beginPath(); c.moveTo(-r*.05, r*.95); c.lineTo(0, l); c.lineTo(r*.05, r*.95); c.fill(); }
  c.setTransform(c.getTransform()); c.restore();
  /* destellos (estrellas de 4 puntas) */
  c.save(); c.globalCompositeOperation = 'lighter';
  for (let i=0;i<9;i++){
    const ph = (t*.7 + i*.37) % 1, a = i*2.39 + t*.35, d = r*(1.02 + .32*ph), sx = x + Math.cos(a)*d, sy = y + Math.sin(a)*d;
    const s = r*.16*Math.sin(ph*Math.PI), al = Math.sin(ph*Math.PI);
    c.fillStyle = `rgba(255,245,180,${al})`; c.shadowColor = '#ffd23f'; c.shadowBlur = 10;
    c.beginPath(); c.moveTo(sx, sy-s); c.quadraticCurveTo(sx, sy, sx+s, sy); c.quadraticCurveTo(sx, sy, sx, sy+s); c.quadraticCurveTo(sx, sy, sx-s, sy); c.quadraticCurveTo(sx, sy, sx, sy-s); c.fill();
  }
  c.restore();
}

/* ── fin de partida ── */
function gameOver(){
  if (G.over) return;
  G.over = true; G.endT = 0; G.mode=null; LS.del('save');
  $('#game').classList.remove('fever');
  G.bodies.forEach(b=>b.flash=1);
  SFX.over(); vib([100,50,200]); G.shake = 12;
  G.popQ = G.bodies.slice().sort((a,b)=>a.y-b.y);
}
function endAnim(dt){
  G.endT += dt;
  if (G.endT > .9 && G.popQ && G.popQ.length){
    G.popT = (G.popT||0) - dt;
    if (G.popT <= 0){ const b=G.popQ.shift(); b.dead=true; G.bodies=G.bodies.filter(x=>!x.dead); burst(b.x,b.y,LV[b.lv].c,12,.7); tone(300+b.lv*60,.07,'triangle',.05); G.popT = Math.max(.02, .5/Math.max(10,G.popQ.length+10)); }
  }
  if (G.endT > .9 && (!G.popQ || !G.popQ.length) && !G.endShown){ G.endShown = true; showEnd(); }
}
async function showEnd(){

  modal(`<img class="goLucas" src="img/lucas_miedo.webp" alt="">

    <div class="stats">
      <div class="stat"><b><img src="${iconURL(g.maxLv,32)}" style="width:28px;vertical-align:middle"></b><small>${esc(LV[g.maxLv].n)}</small></div>

    ${misHTML()}
    <button class="btn huge green pulse" id="goAgain">🔁 OTRA PARTIDA</button>

  if (rec){ setTimeout(()=>{ SFX.record(); burstConfetti(); }, 500); }
  let v=0; const tgt=g.score, el=$('#goSc'), st=performance.now();
  (function cnt(){ const p=Math.min(1,(performance.now()-st)/900); v=Math.round(tgt*easeOut(p)); if(el) el.textContent=fmt(v); if(p<1) requestAnimationFrame(cnt); })();
  $('#goAgain').onclick = ()=>{ SFX.click(); startGame(); };

    const box = $('#goRank');
    if (r.ok){
      USER.user = r.user; LS.set('user', USER); if (r.ranking) RK = r.ranking;

/* ═════════════ PANEL ADMIN (oculto) ═════════════ */
const NFC_SVG = '<svg viewBox="0 0 64 64"><rect x="14" y="6" width="36" height="52" rx="7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M27 24a9 9 0 0 1 0 16M33 19a16 16 0 0 1 0 26M39 14a23 23 0 0 1 0 36" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
const Admin = (()=>{
  let ADM = null, D = null, nfcCtrl = null, nfcBusy = false;
  try{ ADM = sessionStorage.getItem('le_adm'); }catch(e){}
  const hayNfc = 'NDEFReader' in window;
  const setAdm = t=>{ ADM=t; try{ sessionStorage.setItem('le_adm', t); }catch(e){} };
  function pararNfc(){ if(nfcCtrl){ try{ nfcCtrl.abort(); }catch(e){} nfcCtrl=null; } nfcBusy=false; }
  async function escuchar(onSerial, t){
    pararNfc();
    try{
      nfcCtrl = new AbortController(); const r = new NDEFReader();
      await r.scan({signal:nfcCtrl.signal});
      t('📡 Esperando la llave… acércala a la parte de atrás del móvil');
      r.onreading = async ev=>{
        if (nfcBusy) return; nfcBusy=true; vib(80);
        try{ await onSerial(String(ev.serialNumber||'').replace(/:/g,'')); pararNfc(); }
        catch(e){ toast(errMsg(e),1); t('Vuelve a acercar la llave'); nfcBusy=false; }
      };
    }catch(e){ pararNfc(); t('Toca el botón para activar el lector NFC'); }
  }
  function abrir(){
    SFX.click();
    if (ADM) return panel();
    modal(`<div style="text-align:center;display:flex;flex-direction:column;gap:10px">
      <div class="nfcAnim">${NFC_SVG}</div><h2 class="t">ACCESO RESTRINGIDO</h2>
      ${hayNfc?`<div class="ptxt" id="aTxt">Activando lector…</div><button class="btn green hidden" id="bNfc">🔑 Activar lector NFC</button>`:'<div class="ptxt">Este dispositivo no tiene NFC.</div>'}
      <div class="sep"><span>o código de Google Authenticator</span></div>
      <input class="inp" id="aTotp" inputmode="numeric" maxlength="6" placeholder="123456" style="text-align:center;letter-spacing:6px">
      <button class="btn" id="aTotpB">Entrar con código</button>
      <button class="btn ghost" id="aCerrar">Cerrar</button></div>`, pararNfc);
    $('#aCerrar').onclick = ()=>{ pararNfc(); closeModal(); };
    $('#aTotpB').onclick = async()=>{ try{ const r=await call('admTotp',{codigo:$('#aTotp').value}); setAdm(r.adm); pararNfc(); panel(); }catch(e){ toast(errMsg(e),1); } };
    if (hayNfc){
      const txt = t=>{ const e=$('#aTxt'); if(e) e.textContent=t; const b=$('#bNfc'); if(b) b.classList.toggle('hidden', !/Toca el botón/.test(t)); };
      const ok = async serial=>{ const r = await call('admLlave',{llave:serial, ses:USER&&USER.ses});
        if (r.nueva) toast('🔑 Llave registrada como llave de admin'); setAdm(r.adm); SFX.evolve(); panel(); };
      $('#bNfc').onclick = ()=>escuchar(ok, txt);
      escuchar(ok, txt);
    }
  }
  async function adm(op, d){
    const r = await api('adm', {adm:ADM, op, d});
    if (!r.ok){ if (r.error==='ADMIN'){ ADM=null; try{sessionStorage.removeItem('le_adm');}catch(e){} closeModal(); toast('La sesión de admin ha caducado',1); } throw new Error(r.error); }
    return r;
  }
  async function panel(){
    modal('<h2 class="t">🛠 PANEL ADMIN</h2><div class="spinner"></div>');
    try{ D = await adm('resumen'); pinta(); }catch(e){ toast(errMsg(e),1); }
  }
  function pinta(){
    const m = $('#modal .modal'); if (!m) return; m.style.maxWidth='720px'; m.classList.add('adm');
    const a = D.ajustes;
    m.innerHTML = `<h2 class="t">🛠 PANEL ADMIN</h2>
      <div class="stats"><div class="stat"><b>${D.usuarios.length}</b><small>Jugadores</small></div><div class="stat"><b>${D.partidasHoy}</b><small>Partidas hoy</small></div><div class="stat"><b>${D.partidasTotal}</b><small>Partidas total</small></div></div>
      <div class="lbl">Aviso en el menú</div><input class="inp" id="aBan" value="${esc(a.banner)}" placeholder="Ej: ¡Torneo este fin de semana!">
      <label class="chk"><input type="checkbox" id="aMant" ${a.mant?'checked':''}> Mostrar aviso de mantenimiento</label>
      <input class="inp" id="aMantMsg" value="${esc(a.mantMsg)}">
      <div class="row"><button class="btn green" id="aSave">💾 Guardar</button><button class="btn ghost" id="aImg">🖼 Recargar imágenes (v${a.imgVer})</button></div>
      <h2 class="t" style="font-size:15px">JUGADORES</h2>
      <div style="overflow:auto;max-height:38vh"><table><tr><th>Jugador</th><th>Récord</th><th>Niv</th><th>🔥</th><th>Part.</th><th></th></tr>
      ${D.usuarios.map(u=>`<tr><td>${esc(u.nombre)}<br><small style="color:var(--mut)">${esc(u.email)}${u.google?' · G':''}</small></td><td>${fmt(u.mejor)}</td><td>${u.nivel}</td><td>${u.racha}</td><td>${u.partidas}</td>
        <td><button class="btn ghost sm" data-bl="${esc(u.email)}" data-v="${u.bloq?0:1}">${u.bloq?'Desbloquear':'Bloquear'}</button></td></tr>`).join('')}</table></div>
      <h2 class="t" style="font-size:15px">ÚLTIMAS PARTIDAS</h2>
      <div style="overflow:auto;max-height:28vh"><table><tr><th>Fecha</th><th>Jugador</th><th>Puntos</th><th>Niv</th><th>Seg</th></tr>

      <h2 class="t" style="font-size:15px">SEGURIDAD</h2>

      <div class="row"><button class="btn ghost" id="aSalir">Salir del panel</button><button class="btn ghost" id="aCer">Cerrar</button></div>`;
    $('#aSave').onclick = async()=>{ try{ const r=await adm('ajustes',{banner:$('#aBan').value, mant:$('#aMant').checked, mantMsg:$('#aMantMsg').value}); D.ajustes=r.ajustes; PUB.banner=r.ajustes.banner; PUB.mant=r.ajustes.mant; PUB.mantMsg=r.ajustes.mantMsg; toast('✅ Guardado'); }catch(e){ toast(errMsg(e),1); } };
    $('#aImg').onclick = async()=>{ try{ const r=await adm('imgVer'); D.ajustes.imgVer=r.imgVer; toast('✅ Las imágenes se recargarán en todos los móviles'); pinta(); }catch(e){ toast(errMsg(e),1); } };
    m.querySelectorAll('[data-bl]').forEach(b=>b.onclick=async()=>{ try{ await adm('bloquear',{email:b.dataset.bl, bloq:b.dataset.v==='1'}); D=await adm('resumen'); pinta(); }catch(e){ toast(errMsg(e),1); } });
    $('#aTotpN').onclick = async()=>{ try{ const r=await adm('totpNuevo'); D.totp=true;
      $('#aTotpBox').innerHTML=`<div class="banner" style="word-break:break-all">Añade esta clave en Google Authenticator (Introducir clave de configuración):<br><b style="font-size:18px;letter-spacing:2px">${r.secreto}</b><br><a href="${r.url}" style="color:var(--neon)">Abrir en Authenticator</a></div>`; }catch(e){ toast(errMsg(e),1); } };
    $('#aLlB').onclick = async()=>{ try{ await adm('llavesBorrar'); D.llaves=0; toast('Llaves borradas. La próxima que acerques (con tu sesión de admin) quedará registrada'); pinta(); }catch(e){ toast(errMsg(e),1); } };
    $('#aSalir').onclick = ()=>{ ADM=null; try{sessionStorage.removeItem('le_adm');}catch(e){} closeModal(); };
    $('#aCer').onclick = closeModal;
  }
  return { abrir };
})();

/* ═════════════ ORIENTACIÓN: móvil en vertical, tablet en horizontal ═════════════ */
const Orient = (()=>{
  const short = Math.min(screen.width, screen.height);
  const touch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  const tipo = !touch ? 'pc' : (short < 600 ? 'movil' : 'tablet');
  function lock(){
    if (tipo==='pc') return;
    try{ screen.orientation && screen.orientation.lock && screen.orientation.lock(tipo==='movil' ? 'portrait-primary' : 'landscape').catch(()=>{}); }catch(e){}
  }
  function check(){
    if (tipo==='pc') return;
    const land = innerWidth > innerHeight, mal = (tipo==='movil' && land) || (tipo==='tablet' && !land);
    const el = $('#rot'); el.classList.toggle('hidden', !mal); el.classList.toggle('toLand', tipo==='tablet');
    $('#rotT').textContent = tipo==='movil' ? 'GIRA EL MÓVIL' : 'GIRA LA TABLET';
    $('#rotP').textContent = tipo==='movil' ? 'LUCAS EVOLUCIONA se juega con el móvil en vertical' : 'En la tablet se juega en horizontal';
    if (mal && G && !G.over && !G.paused && !$('#game').classList.contains('hidden')) pause(true);
    if (!mal) setTimeout(resize, 120);
  }
  addEventListener('resize', check); addEventListener('orientationchange', ()=>setTimeout(check, 200));
  document.addEventListener('pointerdown', lock, {once:true});
  check(); lock();
  return { tipo, check };
})();

/* ═════════════ AUTO-ACTUALIZACIÓN ═════════════ */
async function checkVersion(){
  try{
    const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'}); if(!r.ok) return;
    const v = String((await r.json()).v);
    if (v && v !== APP_V){
      if (G && !G.over && !G.paused && !document.hidden) { G._updPending = true; return; }  // no cortar una partida
      saveGame();
      const o=document.createElement('div'); o.className='ov'; o.style.zIndex=99;
      o.innerHTML='<div style="text-align:center"><div class="spinner"></div><h2 class="t">NUEVA VERSIÓN</h2><p class="ptxt">Lucas se está actualizando…</p></div>';
      document.body.appendChild(o);
      try{ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){}
      setTimeout(()=>location.reload(), 1000);
    }
  }catch(e){}
}
setInterval(checkVersion, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkVersion(); });
setTimeout(checkVersion, 4000);
